# LXB_LXB723ZG_P1 的 OpenOCD 目标配置

transport select swd

set CHIPNAME stm32h723zg
set OCTOSPI1 1
set OCTOSPI2 0

# 注册 STM32 内部 flash 以及 OCTOSPI1 的 stmqspi bank。
source [find target/stm32h7x.cfg]

# stm32h7x.cfg 默认设置为 4 MHz，因此必须在 source 之后覆盖。
# 16 MHz 已通过下载、校验和调试暂停测试。
adapter speed 16000

reset_config srst_only

# 将 OCTOSPI1 配置为保守的 1-1-1 内存映射读取模式。在把参数传给
# stmqspi 驱动之前，外部 flash 会先被复位，使其从 QPI 或 SPI 状态
# 恢复到已知状态。
proc lxb_octospi1_init {} {
	global a

	# RCC_AHB4ENR：使能 GPIOF 和 GPIOG 时钟。
	mmw 0x580244E0 0x00000060 0x00000000

	# RCC_AHB3ENR：使能 OCTOSPIM（bit 21）和 OCTOSPI1（bit 14）时钟。
	mmw 0x580244D4 0x00204000 0x00000000

	# RCC_D1CCIPR：选择 HCLK 作为 OCTOSPI 内核时钟。这样可以避免
	# 依赖复位之后应用程序的 PLL 配置。
	mmw 0x5802444C 0x00000000 0x00000030

	sleep 1

	# OCTOSPIM Port 1：将 CLK、NCS 和 IO[3:0] 路由到 OCTOSPI1。
	mww 0x5200B404 0x00010101
	mww 0x5200B408 0x00000000

	# GPIOF：
	#   PF6  = OCTOSPIM_P1_IO3 (AF10)
	#   PF7  = OCTOSPIM_P1_IO2 (AF10)
	#   PF8  = OCTOSPIM_P1_IO0 (AF10)
	#   PF9  = OCTOSPIM_P1_IO1 (AF10)
	#   PF10 = OCTOSPIM_P1_CLK (AF9)
	# 复用推挽输出、极高速度、无上拉/下拉。
	mmw 0x58021400 0x002AA000 0x00155000
	mmw 0x58021404 0x00000000 0x000007C0
	mmw 0x58021408 0x003FF000 0x00000000
	mmw 0x5802140C 0x00000000 0x003FF000
	mmw 0x58021420 0xAA000000 0x55000000
	mmw 0x58021424 0x000009AA 0x00000655

	# GPIOG：
	#   PG6 = OCTOSPIM_P1_NCS (AF10)
	# 复用推挽输出、极高速度、无上拉/下拉。
	mmw 0x58021800 0x00002000 0x00001000
	mmw 0x58021804 0x00000000 0x00000040
	mmw 0x58021808 0x00003000 0x00000000
	mmw 0x5802180C 0x00000000 0x00003000
	mmw 0x58021820 0x0A000000 0x05000000

	# OCTOSPI1 基础配置：
	#   W25Q64 大小     = 2^23 字节（DEVSIZE 寄存器值为 22）
	#   时钟分频        = 2（64 MHz HCLK -> 32 MHz）
	mww 0x52005130 0x00001000
	mww 0x52005008 0x01160100
	mww 0x5200500C 0x00000001

	# CPU 复位不会复位外部 flash。首先在 QPI 模式下发送 Reset Enable
	# (0x66) 和 Reset Device (0x99)；如果 flash 处于 SPI 模式，这些命令
	# 会被直接忽略。然后在 SPI 模式下重复发送。这样无论前一个应用处于
	# 什么状态，都能保证进入已知的 SPI 状态。
	mww 0x52005000 0x00000001
	mww 0x52005108 0x40000000
	mww 0x52005100 0x00000003
	mww 0x52005110 0x00000066
	sleep 1
	mww 0x52005110 0x00000099
	sleep 2

	mww 0x52005100 0x00000001
	mww 0x52005110 0x00000066
	sleep 1
	mww 0x52005110 0x00000099
	sleep 2

	# 使用命令 0x03、1-1-1 协议和 24 位地址进行内存映射读取。
	# 本板需要半周期采样位移。
	mww 0x52005000 0x3040000B
	mww 0x52005108 0x40000000
	mww 0x52005100 0x01002101
	mww 0x52005110 0x00000003

	# stmqspi 根据 JEDEC ID 自动选择 W25Q64FV/JV 的内置参数。
}

# OCTOSPI 状态在复位时会丢失，因此每次 reset-init 事件都要重新初始化。
$_CHIPNAME.cpu0 configure -event reset-init {
	lxb_octospi1_init
}

# Cortex-Debug 连接后会立即读取 GDB memory map。必须先完成 reset-init，
# 否则尚未探测的 0x90000000 bank 会被 GDB 当成普通 RAM，导致 load 失败。
$_CHIPNAME.cpu0 configure -event gdb-attach {
	reset init
}
